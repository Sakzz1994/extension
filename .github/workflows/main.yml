name: Branch Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node.js
        run: |
          node --version
          npm --version
